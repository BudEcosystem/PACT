# 02P C12: `RunUsage` is the run meter: one request per model call, counted.
row: C12
says: '`RunUsage` is the run meter: one request per model call, counted'
model:
- call: orders
  args:
    action: order-status
    order-number: A-1
- say: It has shipped.
expect:
  requests: 2
import:
  mapped:
  - description
  - instructions
  - name
  - toolsets
  not-portable: []
# S2 and S3: what its export cannot carry, and whether a spec file brings the agent back whole.
export:
  not-carried:
  - 'resources (resource-kind: mcp-server)'
  - uses
  round-trip: 'a spec file holds no tools, so `uses:` and the server they reach do not come
    back (the live door holds them: `tests/test_both_directions_of_the_one_framework_that_writes_agents_down.py`)'
