# 02P A4: a hole in `instructions:` is filled; the model receives the filled text.
row: A4
says: a hole in `instructions:` is filled; the model receives the filled text
inputs:
  brand: Lumen Lamps
model:
- say: ok
expect:
  instructions-have:
  - You answer for Lumen Lamps, and only for it.
check:
# `pact check` refuses a hole naming a run input the agent does not declare.
- files:
    agents/desk/agent.yaml: |
      description: Answers order questions.
      instructions: You answer for {{run-inputs.colour}}, and only for it.
      run-inputs:
        brand: text
  refused: loader/no-such-run-input
import:
  mapped:
  - description
  - instructions
  - name
  not-portable: []
