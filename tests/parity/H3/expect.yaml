# 02P H3: answered with edited arguments, the call runs with the values the person wrote, once.
row: H3
says: answered with edited arguments, the call runs with the values the person wrote,
  once
model:
- call: payments
  args:
    action: refund
    order-number: A-1
    amount: 40.00 USD
- say: Refunded.
answers:
  payments:
    edit:
      action: refund
      order-number: A-1
      amount: 25.00 USD
expect:
  waiting:
  - payments
  calls:
  - payments:
      action: refund
      order-number: A-1
      amount: 25.00 USD
  output: Refunded.
variants:
# The denial reaches the model in the person's own words, and nothing runs.
- model:
  - call: payments
    args:
      action: refund
      order-number: A-1
      amount: 40.00 USD
  - say: Not refunded.
  answers:
    payments:
      deny: Not without the receipt, please ask for it first.
  expect:
    waiting:
    - payments
    calls: []
    model-saw:
    - Not without the receipt, please ask for it first.
    output: Not refunded.
import:
  mapped:
  - description
  - instructions
  - name
  - requires_approval
  - toolsets
  not-portable: []
# S2 and S3: what its export cannot carry, and whether a spec file brings the agent back whole.
export:
  not-carried:
  - policy
  - 'resources (resource-kind: mcp-server)'
  - uses
  round-trip: 'a spec file holds no tools, so `uses:` and the server they reach do not come
    back (the live door holds them: `tests/test_both_directions_of_the_one_framework_that_writes_agents_down.py`)'
