# 02P C8: `limits:` `steps-at-most` is `UsageLimits.request_limit`: the run stops at the ceiling.
row: C8
says: '`limits:` `steps-at-most` is `UsageLimits.request_limit`: the run stops at
  the ceiling'
limits: true
model:
- call: orders
  args:
    action: order-status
    order-number: A-1
expect:
  raises: UsageLimitExceeded
import:
  mapped:
  - description
  - instructions
  - name
  - toolsets
  not-portable: []
# S2 and S3: what its export cannot carry, and whether a spec file brings the agent back whole.
export:
  not-carried:
  - limits
  - 'resources (resource-kind: mcp-server)'
  - uses
  round-trip: a spec file holds no ceilings and no tools
