# 02P O2: a typed `answers-with:` (a choice, money, a whole number, yes or no) comes back as that shape.
row: O2
says: a typed `answers-with:` (a choice, money, a whole number, yes or no) comes back
  as that shape
model:
- say:
    status: shipped
    refund: 0.00 USD
    parcels: 2
    late: false
expect:
  output:
    status: shipped
    refund: 0.00 USD
    parcels: 2
    late: false
import:
  mapped:
  - description
  - instructions
  - name
  - output_type
  not-portable: []
# S2 and S3: what its export cannot carry, and whether a spec file brings the agent back whole.
export:
  not-carried: []
  round-trip: 'money is one-way: it reaches the model as text with its currency in the description
    and comes back as `text` (named in the export''s carried note)'
