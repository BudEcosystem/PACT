# 02P P1: a tool with `connect:` is offered, and its call reaches the host's connection with its action.
row: P1
says: a tool with `connect:` is offered, and its call reaches the host's connection
  with its action
model:
- call: orders
  args:
    action: order-status
    order-number: A-1
- say: It has shipped.
tool-returns:
  orders:
    status: shipped
expect:
  calls:
  - orders:
      action: order-status
      order-number: A-1
  model-saw:
  - shipped
  # FR-4.1.14: the export names the MCP wire shape the host's install decides.
  export-not-carried:
    'resources (resource-kind: mcp-server)':
    - FR-4.1.14 requires
import:
  mapped:
  - description
  - instructions
  - name
  - toolsets
  not-portable: []
# S2 and S3: what its export cannot carry, and whether a spec file brings the agent back whole.
export:
  not-carried:
  - 'resources (resource-kind: mcp-server)'
  - uses
  round-trip: 'a spec file holds no tools, so `uses:` and the server they reach do not come
    back (the live door holds them: `tests/test_both_directions_of_the_one_framework_that_writes_agents_down.py`)'
