# 02P C10: PACT's money and time ceilings have no Pydantic AI home: the export names them, and none is invented.
row: C10
says: 'PACT''s money and time ceilings have no Pydantic AI home: the export names
  them, and none is invented'
model:
- say: ok
expect:
  usage-limits:
    # The step ceiling IS carried, unwritten: law 2, option A (docs/98 WP-3,
    # decided 2026-11-10). Every host gets PACT's default of 8 steps, so "this
    # agent stops" holds on Pydantic AI's loop as on PACT's. Money and time still
    # have no Pydantic AI home, and none is invented for them.
    request_limit: 8
    tool_calls_limit: null
    total_tokens_limit: null
  export-not-carried:
    limits:
    - '`cost-per-request-under: 0.05 USD`'
    - '`runs-for-at-most: 2m`'
    - '`when-it-runs-out: stop-and-say-so`'
import:
  mapped:
  - description
  - instructions
  - name
  not-portable: []
# S2 and S3: what its export cannot carry, and whether a spec file brings the agent back whole.
export:
  not-carried:
  - limits
  round-trip: a spec file holds no ceilings, so `limits:` does not come back
