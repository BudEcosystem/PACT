# 02P A14: `checks-at-most: 1`: a second answer that breaks a `checked-by:` rule fails the run.
row: A14
says: '`checks-at-most: 1`: a second answer that breaks a `checked-by:` rule fails
  the run'
# PACT's `checks-at-most:` counts attempts in all (spec/schema.yaml), so at n = 1
# the first broken answer fails the step and no second attempt is asked for;
# the script would pass on the third.
model:
- say: Hello.
- say: Hello again.
- say: Your order has shipped.
expect:
  raises: UnexpectedModelBehavior
  model-asked: 1
import:
  mapped:
  - description
  - instructions
  - name
  # validators and retry budgets have no public read: the import's `not_shown` names them.
  not-portable: []
# S2 and S3: what its export cannot carry, and whether a spec file brings the agent back whole.
export:
  not-carried:
  - checked-by
  - checks-at-most
  round-trip: a spec file has no field for a check and its count, so they do not come back
