# 02P C6: nothing to write: `instructions:` are sent again with every request.
row: C6
says: 'nothing to write: `instructions:` are sent again with every request'
model:
- call: orders
  args:
    action: order-status
    order-number: A-1
- say: It has shipped.
tool-returns:
  orders:
    status: shipped
expect:
  every-request-has-instructions: true
import:
  mapped:
  - description
  - instructions
  - name
  - toolsets
  not-portable: []
# S2 and S3: what its export cannot carry, and whether a spec file brings the agent back whole.
export:
  not-carried:
  - 'resources (resource-kind: mcp-server)'
  - uses
  round-trip: 'a spec file holds no tools, so `uses:` and the server they reach do not come
    back (the live door holds them: `tests/test_both_directions_of_the_one_framework_that_writes_agents_down.py`)'
