# 02P H1: a call the policy gates parks the run on `DeferredToolRequests.approvals`, and nothing runs.
row: H1
says: a call the policy gates parks the run on `DeferredToolRequests.approvals`, and
  nothing runs
model:
- call: payments
  args:
    action: refund
    order-number: A-1
    amount: 40.00 USD
expect:
  waiting:
  - payments
  calls: []
import:
  mapped:
  - description
  - instructions
  - name
  - requires_approval
  - toolsets
  not-portable: []
# S2 and S3: what its export cannot carry, and whether a spec file brings the agent back whole.
export:
  not-carried:
  - policy
  - 'resources (resource-kind: mcp-server)'
  - uses
  round-trip: 'a spec file holds no tools, so `uses:` and the server they reach do not come
    back (the live door holds them: `tests/test_both_directions_of_the_one_framework_that_writes_agents_down.py`)'
