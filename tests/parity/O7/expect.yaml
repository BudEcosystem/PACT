# 02P O7: a `checked-by:` rule the answer breaks sends it back once, then the kept answer is the answer.
row: O7
says: a `checked-by:` rule the answer breaks sends it back once, then the kept answer
  is the answer
model:
- say: Hello.
- say: Your order has shipped.
expect:
  output: Your order has shipped.
  requests: 2
  model-saw:
  - the customer must hear about the order
variants:
# ... then fails the step: three broken answers at `checks-at-most: 3`.
- model:
  - say: Hello.
  - say: Hello again.
  - say: Hi.
  - say: Your order has shipped.
  expect:
    raises: UnexpectedModelBehavior
    model-asked: 3
import:
  mapped:
  - description
  - instructions
  - name
  # validators and retry budgets have no public read: the import's `not_shown` names them.
  not-portable: []
# S2 and S3: what its export cannot carry, and whether a spec file brings the agent back whole.
export:
  not-carried:
  - checked-by
  - checks-at-most
  round-trip: a spec file has no field for a check and its count, so they do not come back
