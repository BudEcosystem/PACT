# 02P A2: `description:` with a hole is filled from the run's inputs; no braces reach anyone.
row: A2
says: '`description:` with a hole is filled from the run''s inputs; no braces reach
  anyone'
inputs:
  brand: Lumen Lamps
model:
- say: ok
expect:
  description: Answers order questions for Lumen Lamps.
  # Exported, the hole is Pydantic AI's `{{brand}}` template over `deps_schema`, which
  # `Agent.from_spec` fills from the run's deps (02P A4).
  export-carries:
    description: Answers order questions for {{brand}}.
held-elsewhere:
  braces survive the import: adapters/python/tests/test_parity.py::test_a2_braces_in_a_pydantic_ai_description_import_as_written
import:
  mapped:
  - description
  - instructions
  - name
  not-portable: []
# S2 and S3: what its export cannot carry, and whether a spec file brings the agent back whole.
export:
  not-carried: []
  round-trip: the same digest
