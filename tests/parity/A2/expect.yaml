# 02P A2: `description:` with a hole is filled from the run's inputs; no braces reach anyone.
row: A2
says: '`description:` with a hole is filled from the run''s inputs; no braces reach
  anyone'
inputs:
  brand: Lumen Lamps
model:
- say: ok
expect:
  description: Answers order questions for Lumen Lamps.
  # Exported with no run, the braces are carried as written, and the report says
  # they reach the model unfilled.
  export-carries:
    description: Answers order questions for {{run-inputs.brand}}.
  export-not-carried:
    description.holes:
    - '`{{run-inputs.brand}}`'
held-elsewhere:
  braces survive the import: adapters/python/tests/test_parity.py::test_a2_braces_in_a_pydantic_ai_description_import_as_written
import:
  mapped:
  - description
  - instructions
  - name
  not-portable: []
