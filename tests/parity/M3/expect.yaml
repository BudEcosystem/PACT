# 02P M3: `model: [a, b]` is `FallbackModel`: a forced error on the first answers from the second.
row: M3
says: '`model: [a, b]` is `FallbackModel`: a forced error on the first answers from
  the second'
# The host's model for each id `model:` names; `build_agent(models=...)` makes the chain.
host-models:
  qwen2.5-14b-instruct: fails
  gpt-oss-20b: answers
model:
- say: From the second.
expect:
  chain:
  - qwen2.5-14b-instruct
  - gpt-oss-20b
  output: From the second.
  model-asked: 1
  export-not-carried:
    model.fallbacks:
    - '`gpt-oss-20b`'
held-elsewhere:
  b is held to egress: crates/pact-cli/tests/a_model_list_is_a_fallback_chain.rs::a_fallback_that_leaves_the_box_is_refused_at_that_entry
import:
  mapped:
  - description
  - instructions
  - model
  - name
  not-portable: []
