description: Answers questions about an order.
instructions: >
  Look the order up and answer the question about it.
uses:
  - orders
remembers:
  verified-account:
    description: The account this person proved they hold, earlier in the conversation.
    lasts: one-conversation
    kept-for: 30d
    # A tool must never write here: an account somebody proved they hold is not
    # something a tool result may quietly replace.
    never-from:
      - tool output
  last-order-seen:
    description: The last order this conversation looked at.
    lasts: one-conversation
    kept-for: 1d
limits:
  when-it-runs-out: stop-and-say-so
  steps-at-most: 4
