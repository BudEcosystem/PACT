description: Flows in this workspace asking for a parent's CRM contact.
kind: inbound-call
answers: parent-contact
same-conversation-when: [email]
# The CRM's search lags by seconds, so two bookings close together would both
# create a contact. One at a time per email address closes that.
if-still-running: queue
who-can-reach-it: [workflows in this workspace]
