description: Create or update one parent in the CRM, one at a time per email address.
accepts: { email: text, first-name: text, last-name: text, phone: text }
answers-with: { contact-id: text }
starts-at: upsert
steps:
  upsert:
    does: call
    call: crm/create-or-update-contact
    bind:
      email: input.email
      first-name: input.first-name
      last-name: input.last-name
      phone: input.phone
      lifecycle-stage: values.lead-stage
    at-most: 3
    then: { answered: reply }
  reply:
    does: answer
