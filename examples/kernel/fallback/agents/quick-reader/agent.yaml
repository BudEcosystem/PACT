description: Answers a customer question from the product notes, quickly.
instructions: |
  Answer the customer's question from the product notes you are given. If the
  notes do not answer it, say so in one sentence rather than guessing.
accepts:
  question: text
  notes: text
answers-with:
  answer: text
  confidence: one of high, low
# The answer is checked before it is the answer; a miss is sent back with the
# reason, twice at most, then the stage counts this attempt as failed.
checked-by:
  - must-not-contain: ["I think", "probably"]
    because: a hedge is not an answer the customer can act on
checks-at-most: 2
needs:
  reasoning: simple
  prefer: cheapest
  because: most questions are answered by one passage of the notes
