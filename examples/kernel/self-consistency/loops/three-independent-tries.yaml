description: Work the question through three times, independently, then settle.
starts-at: attempt
steps:
  attempt:
    does: think
    # Each attempt starts from the question, not from the attempt before it.
    forks: yes
    says: Work the question through from the beginning and give your answer.
    at-most: 3
    then:
      used-a-tool: attempt
      answered: attempt
      too-many-times: settle
  settle:
    does: answer
    says: >
      You are shown three independent attempts. Give the answer most of them
      reached, and say plainly if they disagreed.
    then:
      answered: done
