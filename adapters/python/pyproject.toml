[project]
name = "pact-adapters"
version = "0.1.0"
description = """\
The Python adapters for PACT: seven transports, the harness that owns the loop, \
the eval runner, the learning gate and the model resolver."""
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

dependencies = [
    "anthropic>=0.120.0",
    "autogen-agentchat>=0.7.5",
    "autogen-core>=0.7.5",
    "deepeval>=4.1.3",
    "langchain-core>=1.5.1",
    "langgraph>=1.2.9",
    "openai-agents>=0.18.3",
    # The response TYPES `openai_agents_transport.py` constructs at module
    # level — a different distribution from `openai-agents` above, which is
    # what pulls it in today. Found by
    # `test_the_manifest_names_what_the_source_imports.py` on its first run,
    # beside `httpx`: two hard imports resolving on somebody else's
    # dependency graph.
    "openai>=2.16.0",
    "pydantic-ai-slim>=2.18.0",
    "pytest>=9.1.1",
    # Talk to a locally-served model, and to a locally-served grader. Same reason
    # as `pyyaml` below: `ollama_transport.py` and `judge.py` both
    # `import httpx` directly, and `scripts/pact-eval` PROBES for it — that probe
    # is what decides whether a bare `python3` is used at all, so the one
    # interpreter path the wrapper falls back to was gated on a package the
    # manifest never named. Resolved transitively today, which is exactly the
    # dependency that disappears on the next re-lock.
    "httpx>=0.28",
    # Read `models/catalog.yaml`. Already resolved here transitively; declared
    # because `resolve.py` imports it directly and a dependency the source uses
    # but the manifest does not name is one that disappears on the next re-lock.
    "pyyaml>=6.0",
]


# Without this the project is not a package: `uv` refuses to install the entry
# points above, and `pip install` cannot work at all. Register row C6 said there
# was no install path, and for the adapters this was the whole of it — the code
# was reachable only by putting `adapters/python/src` on PYTHONPATH by hand.
# The commands, so an installed package has them on the PATH rather than
# requiring somebody to know where the adapter keeps its source. Register row
# C6: everything was `cargo run` or `PYTHONPATH=... python -m` from a checkout.
#
# `pact-eval` is the same entry `scripts/pact-eval` reaches — the script stays,
# because it finds an interpreter that HAS these dependencies and an installed
# package is already in one.
[project.scripts]
pact-eval = "pact_adapters.scoring:main"
pact-conformance = "pact_adapters.conformance:main"
pact-pipeline = "pact_adapters.pipeline:main"
pact-explode = "pact_adapters.exploding:main"
pact-import = "pact_adapters.importing:main"
pact-export = "pact_adapters.exporting:main"
pact-improve = "pact_adapters.optimising:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `src/` layout: the package is `pact_adapters`, and the tests live outside it on
# purpose — they read the worked example through the real Rust loader, which is
# not something a wheel should carry.
packages = ["src/pact_adapters"]
