[project]
name = "pact-adapters"
version = "0.1.0"
description = """\
The Python adapters for PACT: seven transports, the harness that owns the loop, \
the eval runner, the learning gate and the model resolver."""
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

# The CORE: what `harness`, `ir`, the loader boundary, the Pydantic AI
# bridge and every command need. Nothing else. A host that runs PACT on
# Pydantic AI installs these three and gets no LangGraph, no AutoGen and no
# DeepEval it never asked for; `test_the_core_needs_no_extra.py` imports every
# core module with the extras made unimportable, so a heavy import that creeps
# into one fails the suite rather than somebody's install.
dependencies = [
    "pydantic-ai-slim>=2.54,<3",
    # Talk to a locally-served model, and to a locally-served grader.
    # `ollama_transport.py` and `judge.py` both `import httpx` directly, and
    # `scripts/pact-eval` PROBES for it — that probe is what decides whether a
    # bare `python3` is used at all, so the one interpreter path the wrapper
    # falls back to was gated on a package the manifest never named.
    "httpx>=0.28",
    # Read `models/catalog.yaml` and the Pydantic AI registry. `resolve.py`
    # imports it directly, and a dependency the source uses but the manifest
    # does not name is one that disappears on the next re-lock.
    "pyyaml>=6.0",
]

# One extra per transport, named by the framework it binds, so a workspace that
# runs on one target installs one framework. `all` is every transport and the
# eval metrics; `test` is what the suite itself needs (`uv run --extra all
# --extra test pytest`, which `scripts/test-all.sh` runs).
[project.optional-dependencies]
anthropic = ["anthropic>=0.120.0"]
autogen = ["autogen-agentchat>=0.7.5", "autogen-core>=0.7.5"]
# `langgraph_transport.py` builds LangChain messages, so it needs both.
langgraph = ["langgraph>=1.2.9", "langchain-core>=1.5.1"]
langchain = ["langchain-core>=1.5.1"]
# The response TYPES `openai_agents_transport.py` constructs at module level
# come from `openai`, a different distribution from `openai-agents`, which is
# what pulls it in today. Named, because a hard import resolving on somebody
# else's dependency graph is one re-lock from breaking.
openai-agents = ["openai-agents>=0.18.3", "openai>=2.16.0"]
# The eval metrics `providers.py` reaches for, imported lazily when asked.
deepeval = ["deepeval>=4.1.3"]
all = ["pact-adapters[anthropic,autogen,langgraph,langchain,openai-agents,deepeval]"]
test = ["pytest>=9.1.1"]


# Without this the project is not a package: `uv` refuses to install the entry
# points above, and `pip install` cannot work at all. Register row C6 said there
# was no install path, and for the adapters this was the whole of it — the code
# was reachable only by putting `adapters/python/src` on PYTHONPATH by hand.
# The commands, so an installed package has them on the PATH rather than
# requiring somebody to know where the adapter keeps its source. Register row
# C6: everything was `cargo run` or `PYTHONPATH=... python -m` from a checkout.
#
# `pact-eval` is the same entry `scripts/pact-eval` reaches — the script stays,
# because it finds an interpreter that HAS these dependencies and an installed
# package is already in one.
[project.scripts]
pact-eval = "pact_adapters.scoring:main"
pact-conformance = "pact_adapters.conformance:main"
pact-pipeline = "pact_adapters.pipeline:main"
pact-explode = "pact_adapters.exploding:main"
pact-import = "pact_adapters.importing:main"
pact-export = "pact_adapters.exporting:main"
# The other direction for the one target that has a declarative format of its
# own. `pact-export` writes a registry record, which is an index entry; this
# writes an agent spec, which is a runnable agent minus what the format has no
# field for — and the report is where the difference is said.
pact-pydantic-ai = "pact_adapters.pydantic_ai_interop:main"
pact-improve = "pact_adapters.optimising:main"
# The one table from PACT field to Pydantic AI construct (02P §4), written out
# as a page a person reads.
pact-mapping = "pact_adapters.pydantic_ai_registry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `src/` layout: the package is `pact_adapters`, and the tests live outside it on
# purpose — they read the worked example through the real Rust loader, which is
# not something a wheel should carry.
packages = ["src/pact_adapters"]

# The specification and the model catalogue travel with the package, so a host with no checkout
# can still read what a kind's fields are and resolve a shipped model (`pact_adapters.loader.shipped`).
[tool.hatch.build.targets.wheel.force-include]
"../../spec/schema.yaml" = "pact_adapters/spec/schema.yaml"
"../../models/catalog.yaml" = "pact_adapters/models/catalog.yaml"
