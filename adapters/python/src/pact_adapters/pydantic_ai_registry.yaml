# PACT and Pydantic AI, one table (02P §4).
#
# Every agent, tool and action field `spec/schema.yaml` declares, with the
# Pydantic AI construct it becomes; and every capability Pydantic AI ships, with
# what PACT can say of it. Read by `pydantic_ai_registry.py` and nothing else:
# the importers and the exporter in `pydantic_ai_interop.py` ask it, and
# `pact-mapping` writes it out as a page (`docs/impl/MAPPING.md` in Bud Flow).
#
# Three outcomes, no fourth (02P §1):
#   carried  a Pydantic AI construct means the same thing; the value crosses as
#            written.
#   mapped   built from Pydantic AI's public pieces by the adapter: several
#            constructs, or a translation.
#   loss     Pydantic AI has nothing that means it. PACT holds it at check time,
#            or the host holds it at run time, and every report names it.
#
# `rows:` points at the 02P §2 rows that own the full wording. Nothing here
# restates them. Two tests hold this file whole: every field the schema
# declares has a row, and every capability class the installed Pydantic AI
# exports has an entry, so moving the pin is a test run, not a memory exercise.

pydantic-ai: "2.54"

fields:
  # ── agent ──────────────────────────────────────────────────────────────────
  agent.name:
    construct: "Agent(name=...)"
    outcome: carried
    rows: [A2]
  agent.description:
    construct: "Agent(description=...)"
    outcome: carried
    rows: [A2]
    how: "{{run-inputs.x}} and {{remembers.x}} holes are filled from the run's deps before the run starts (A1)"
  agent.base:
    construct: "nothing: a base agent never runs, so nothing is built"
    outcome: mapped
    rows: [A1]
  agent.instructions:
    construct: "Agent(instructions=...), a function of RunContext when the text has holes"
    outcome: carried
    rows: [A3, A4]
    how: "holes are filled by pact_adapters.holes.fill from deps; an unfilled hole is an error, never braces"
  agent.team:
    construct: "one function tool per member, each running the member's own Agent on its own usage and limits; what it spent is then counted in the caller's run"
    outcome: mapped
    rows: [K1]
    spec-file: >-
      no field for who helps. Pydantic AI does delegation by calling one `Agent` from
      inside another's tool function, which is Python, not spec
  agent.teamwork:
    construct: "the member calls of one reply joined once by delegation.ask_team: who is waited for, in what order, each member's share of the budget, and what a failure does"
    outcome: mapped
    rows: [K1, K3]
    spec-file: >-
      no field for how a team's answers are waited for or how a budget is shared
  agent.uses:
    construct: "toolsets: MCPToolset or FunctionToolset per tool; skills as instruction sections; knowledge as one retrieval tool"
    outcome: mapped
    rows: [T1, T11, X5, N4]
    spec-file: >-
      an `AgentSpec` has no `tools:` field — its only tool-bearing field is
      `capabilities:`, which names Pydantic AI's own provider-adaptive tools and not an
      author's. The names are carried in the companion report and `build_agent()` binds
      them; a spec file alone cannot
  agent.accepts:
    construct: "the user prompt: str, plus one BinaryContent (or ImageUrl / AudioUrl / DocumentUrl) part per picture, recording or file"
    outcome: mapped
    rows: [F1]
    spec-file: "no field for the shapes it takes in"
  agent.answers-with:
    construct: "output_type=StructuredDict(<schema>), or str when nothing is declared"
    outcome: carried
    rows: [O1, O2]
  agent.answers-with-mode:
    construct: "output_type wrapped in PromptedOutput / NativeOutput / ToolOutput, or str for `text`"
    outcome: carried
    rows: [O4]
    spec-file: >-
      no field in the SPEC for how the shape is put to the model — `output_schema`
      builds a `StructuredDict`, whose mode is `auto`, decided per model from
      `ModelProfile.default_structured_output_mode`, so an author who wrote
      `native-json-schema` gets whatever their model prefers instead. `build_agent()`
      DOES honour it: the four words map exactly onto `str`, `PromptedOutput`,
      `NativeOutput` and `ToolOutput`. This is the clearest single reason the export has
      two halves
  agent.checked-by:
    construct: "an output_validator raising ModelRetry with the broken rule's words (evals.first_broken)"
    outcome: mapped
    rows: [O7]
    spec-file: "no field for what an answer must satisfy; output validators are Python functions"
  agent.checks-at-most:
    construct: "counted by that output_validator, its own failed checks only; Agent(retries={'output': n}) is one run-wide budget that empty replies spend too"
    outcome: mapped
    rows: [A14, O7]
    spec-file: "no field for how many tries an answer gets"
  agent.run-inputs:
    construct: "deps (the run's inputs); deps_schema in an AgentSpec file"
    outcome: mapped
    rows: [A6]
  agent.needs:
    construct: "nothing: held at check time against models/catalog.yaml, and by the host against the model it binds (resolve.ModelEntry.satisfies)"
    outcome: loss
    rows: [M1]
    spec-file: "no field for what the model behind it has to be capable of"
  agent.limits:
    construct: "a capability holding limits.Limits at the top of each step, after each reply and before each call, with every when-it-runs-out; UsageLimits from usage_limits_for() can only stop"
    outcome: mapped
    rows: [C8, C9, C10]
    spec-file: >-
      no field for ceilings. `UsageLimits` is an argument to `run()`, not part of an
      agent — so a spec file cannot stop a run, and until something passes
      `usage_limits=` the ceilings the author wrote are not enforced.
      `usage_limits_for()` builds the ones that translate
  agent.settings:
    construct: "ModelSettings (the key table is pydantic_ai_transport._SETTINGS)"
    outcome: carried
    rows: [A8]
  agent.policy:
    construct: "toolset.approval_required(<predicate from questions.Gate>); output types include DeferredToolRequests"
    outcome: mapped
    rows: [T4, H1, H3]
    spec-file: >-
      no field for what needs a person. `requires_approval=True` is a per-tool Python
      argument, so an approval rule survives only through `build_agent()`, which sets it
      on the tools the policy names. A spec file alone carries no policy, and an index
      built from these could not tell a governed agent from an ungoverned one
  agent.evals:
    construct: "nothing on Agent: pydantic_evals.Dataset is a separate document"
    outcome: loss
    rows: [E1]
    spec-file: >-
      no field for how you would know it works — that is `pydantic_evals`, a separate
      document
  agent.model:
    construct: "a Model resolved by the host; a list is FallbackModel(*models)"
    outcome: carried
    rows: [M1, M3]
  agent.model-for-checking:
    construct: "a second Model, used by the checking stages of a loop"
    outcome: mapped
    rows: [H9]
    spec-file: "no field for a second model on the checking stages"
  agent.loop:
    construct: "pact:loop/standard is Agent's own tool loop; any other shape is one capability routing each step of that loop with loops.Loop (a stage's tools filtered, its line added to the instructions)"
    outcome: mapped
    rows: [A20, K5]
    spec-file: >-
      no field for the shape of the thinking. Pydantic AI's loop is `_agent_graph`'s and
      has no stage vocabulary — `may-use:`, `does: ask-someone` and the rest have
      nothing to become
  agent.variants:
    construct: "nothing: each variant is a separate Agent (resolve.strategies_of); PACT tries them in order and the host runs the one it names"
    outcome: loss
    rows: [M5]
    spec-file: "no field for model-portability strategies"
  agent.context-policy:
    construct: "ProcessHistory(<processor over context_policy.Tidier>)"
    outcome: mapped
    rows: [C3, C5]
    spec-file: >-
      no field for how a long conversation is kept. Pydantic AI compacts with a history
      processor wrapped in `ProcessHistory`, which takes a callable and is therefore
      marked spec-unusable by its own docs
  agent.remembers:
    construct: "remember / forget function tools over the host's store; {{remembers.x}} holes in the words"
    outcome: mapped
    rows: [N3, X6]
    spec-file: "no field for what survives a summary"
  agent.interceptors:
    construct: "an AbstractCapability whose before_model_request / before_tool_execute hooks run interceptors.Chain"
    outcome: mapped
    rows: [X2, X7]
    spec-file: >-
      no field for rules that hide, stop or redirect. Pydantic AI's nearest shape is a
      capability, which is a Python object and not a sentence

  # ── tool ───────────────────────────────────────────────────────────────────
  tool.available-when:
    construct: "decided once when the agent is built (ir.available): what is not offered is never built, which toolset.prepared(<static filter>) would do per step"
    outcome: mapped
    rows: [T8, T13]
  tool.description:
    construct: "ToolDefinition.description"
    outcome: carried
    rows: [T1]
  tool.connect:
    construct: "MCPToolset over the named mcp-server resource, with mcp_bridge consent and drift checks"
    outcome: carried
    rows: [P1]
  tool.url:
    construct: "a function tool whose body is the host's HTTP call"
    outcome: mapped
    rows: [P7]
  tool.method:
    construct: "the verb that function tool's HTTP call uses"
    outcome: mapped
    rows: [P7]
  tool.says:
    construct: "a function tool whose body is one model call with the tool's wording"
    outcome: mapped
    rows: [K1, N6]
  tool.actions:
    construct: "toolset.filtered(<declared action names>): anything else the server offers is never shown"
    outcome: carried
    rows: [T12]

  # ── action ─────────────────────────────────────────────────────────────────
  action.description:
    construct: "ToolDefinition.description"
    outcome: carried
    rows: [T1]
  action.takes:
    construct: "ToolDefinition.parameters_json_schema (Tool.from_schema)"
    outcome: carried
    rows: [T1]
  action.answers-with:
    construct: "ToolDefinition.return_schema from return_schema_for(); shown with IncludeToolReturnSchemas"
    outcome: carried
    rows: [T2]
    how: "Pydantic AI shows a return_schema and never validates a result against it; the host checks the result"
  action.program:
    construct: "a function tool that runs the carried program on the host's runner"
    outcome: mapped
    rows: [X4]
  action.reads-only:
    construct: "ToolDefinition.sequential=False for a read; a write runs alone"
    outcome: mapped
    rows: [A13, T7]
  action.needs-a-person:
    construct: "requires_approval=True, or a WrapperToolset raising ApprovalRequired(metadata=<the question>); parked as DeferredToolRequests.approvals"
    outcome: carried
    rows: [T4, H1]
  action.spends-money:
    construct: "nothing: PACT requires a same-request-key beside it at check time"
    outcome: loss
    rows: [T4]
  action.same-request-key:
    construct: "nothing: the host fills the named argument with the call's effect key and withholds a second call carrying the same value (at_most_once.claim)"
    outcome: loss
    rows: [D2]
  action.undone-by:
    construct: "nothing: a workflow's undo calls it, newest first, after a later step fails (02W §2.12); one agent run undoes no tool call"
    outcome: loss
    rows: [D2]
  action.status-check:
    construct: "nothing: the host asks it before retrying a write whose outcome is not known (02W §2.12)"
    outcome: loss
    rows: [D2]
  action.same-request-key-across:
    construct: "nothing: how far the host's at-most-once claim reaches (this run, the team, the workspace)"
    outcome: loss
    rows: [D2]
  action.bind:
    construct: "arguments filled from deps inside the tool body, absent from parameters_json_schema"
    outcome: mapped
    rows: [A6]
  action.projects-with:
    # `return_value` is what the model is sent and `content` a SECOND user message it is also
    # sent (pydantic_ai/messages.py:1013-1047); only `metadata` stays out of the model's sight.
    construct: "ToolReturn(return_value=<what the model reads>, metadata=<full>)"
    outcome: mapped
    rows: [T3]
  action.remember-as:
    construct: "the tool's result written to the host's store under the remembers name"
    outcome: mapped
    rows: [N3]
  action.inspects:
    construct: "the arguments the approval predicate is given"
    outcome: mapped
    rows: [T4]

# Every class `pydantic_ai.capabilities` exports, plus the durable-execution
# capabilities, by the name a spec file and `get_serialization_name()` use.
# `pact:` is PACT's spelling of one that crosses; `tool:` the name it takes on
# `uses:`; `why:` the named loss. One without a `why:` is middleware, and is
# told the one sentence `middleware:` below says.
middleware: >-
  `{name}` is Pydantic AI middleware — it wraps `_agent_graph`'s own
  request, tool and run handlers. PACT's answer to that is `interceptors:`,
  which is an authored sentence resolved at load rather than a Python object,
  so there is nothing to translate it into that would still be portable

capabilities:
  Thinking:
    outcome: carried
    rows: [A8]
    pact: "`settings.thinking:`"
  WebSearch:
    outcome: mapped
    rows: [N1]
    pact: "`uses:` — write `tools/web-search.yaml` to say what it may reach"
    tool: web-search
  WebFetch:
    outcome: mapped
    rows: [N1]
    pact: "`uses:` — write `tools/web-fetch.yaml` to say what it may reach"
    tool: web-fetch
  ImageGeneration:
    outcome: mapped
    rows: [N1]
    pact: "`uses:` — write `tools/image-generation.yaml`"
    tool: image-generation
  XSearch:
    outcome: mapped
    rows: [N1]
    pact: "`uses:` — write `tools/x-search.yaml`"
    tool: x-search
  MCP:
    outcome: mapped
    rows: [P1]
    pact: "`uses:` — write one `tools/<name>.yaml` per MCP tool you rely on"
    tool: mcp
  NativeTool:
    outcome: loss
    rows: [N7]
  NativeOrLocalTool:
    outcome: loss
    rows: [N1]
  ToolSearch:
    outcome: loss
    rows: [T9]
  PrefixTools:
    outcome: loss
    rows: [T12]
  SetToolMetadata:
    outcome: loss
    rows: [T7]
  IncludeToolReturnSchemas:
    outcome: loss
    rows: [T2]
  ReinjectSystemPrompt:
    outcome: loss
    rows: [C6]
  Instrumentation:
    outcome: loss
    rows: [I1]
  RaiseContentFilterError:
    outcome: loss
    rows: [X11]
  LocalWorkspace:
    outcome: loss
    rows: [X8]
  Hooks:
    outcome: loss
    rows: [X2]
  PrepareTools:
    outcome: loss
    rows: [T8]
  PrepareOutputTools:
    outcome: loss
    rows: [T8]
  ProcessHistory:
    outcome: loss
    rows: [C3]
  ProcessEventStream:
    outcome: loss
    rows: [S3]
  HandleDeferredToolCalls:
    outcome: loss
    rows: [H6]
  SelectModel:
    outcome: loss
    rows: [M5]
  ResolveModelId:
    outcome: loss
    rows: [M5]
  Toolset:
    outcome: loss
    rows: [T11, T12]
  UseThreadExecutor:
    outcome: loss
    rows: [X11]
  AbstractCapability:
    outcome: loss
    rows: [X1]
  Capability:
    outcome: loss
    rows: [X1]
  CombinedCapability:
    outcome: loss
    rows: [X1]
  WrapperCapability:
    outcome: loss
    rows: [X1]
  DynamicCapability:
    outcome: loss
    rows: [X1]
  TemporalDurability:
    outcome: loss
    rows: [D1]
    why: &the-engine-is-the-hosts >-
      which durable engine runs the agent is the host's choice; PACT's
      `workspace.durability:` says whether a run must survive a restart, and
      the host picks the engine that keeps that promise
  DBOSDurability:
    outcome: loss
    rows: [D1]
    why: *the-engine-is-the-hosts
  PrefectDurability:
    outcome: loss
    rows: [D1]
    why: *the-engine-is-the-hosts
  BaseDurabilityCapability:
    outcome: loss
    rows: [D1]
    why: *the-engine-is-the-hosts
  OpenAICompaction:
    outcome: loss
    rows: [C4]
    why: &provider-compaction >-
      a provider shortening the conversation on its own servers (hosted only, so
      unusable air-gapped). PACT shortens a conversation with `context-policy:`
      (`summarise-older` with `summarised-by:`), which any model can do
  AnthropicCompaction:
    outcome: loss
    rows: [C4]
    why: *provider-compaction

# Pydantic AI's own names that are not capabilities, and what PACT says of
# each, read by the two importers and the exporter. `spec.<key>` is a key of an
# `AgentSpec` file, `agent.<attr>` the attribute of a live `Agent` a report names,
# `settings.<key>` a `ModelSettings` key outside the twelve
# `pydantic_ai_transport._SETTINGS` maps (that table is the authority on those).
# Four more doors are named so the completeness test (02P §6 S4) can hold every
# name the installed Pydantic AI has: `part.<Class>` a message part (what a
# conversation is made of), `event.<Class>` a member of `AgentStreamEvent`,
# `tool-definition.<field>` a field of `ToolDefinition`, and `graph.<method>` a
# public member of pydantic-graph's `GraphBuilder`.
# `pact:` is PACT's spelling of one that crosses; `why:` the named loss; `left:`
# what an export leaves to Pydantic AI's own default, and why.
names:
  spec.model:
    outcome: carried
    rows: [M1, M3]
    pact: "agent `model:`"
  spec.name:
    outcome: carried
    rows: [A2]
    pact: "agent `name:`"
  spec.description:
    outcome: carried
    rows: [A2]
    pact: "agent `description:`"
  spec.instructions:
    outcome: mapped
    rows: [A3, A4]
    pact: "agent `instructions:`"
  spec.model_settings:
    outcome: carried
    rows: [A8]
    pact: "`settings:`"
  spec.output_schema:
    outcome: carried
    rows: [O2]
    pact: "`answers-with:`"
  spec.deps_schema:
    outcome: mapped
    rows: [A6]
    pact: "`run-inputs:`"
  spec.capabilities:
    outcome: mapped
    rows: [A11, N1]
    pact: "`settings.thinking:` and `uses:`, per capability"
  spec.end_strategy:
    outcome: loss
    rows: [A16]
    why: &end_strategy >-
      `early`/`graceful`/`exhaustive` — what Pydantic AI does with tool calls the model
      requested alongside a final result. That is a property of `_agent_graph`'s loop,
      and PACT owns loop semantics itself (`loop:`), so copying the word across would
      claim a stage vocabulary PACT never ran
    left: >-
      what to do with tool calls the model requested alongside a final result. PACT owns
      loop semantics and has no word for this, so Pydantic AI's own default (`graceful`)
      stands
  spec.retries:
    outcome: loss
    rows: [A14]
    why: &retries >-
      how many times Pydantic AI re-asks the model after a tool or output validation
      failure. PACT has no retry budget: a failure is a `limits:` question
      (`when-it-runs-out:`), decided per ceiling and not per category
    left: "how often to re-ask after a tool or output failure — a Pydantic AI budget"
  spec.tool_timeout:
    outcome: loss
    rows: [A15]
    why: &tool_timeout >-
      how long one tool call may take before Pydantic AI returns a retry prompt. PACT
      bounds the RUN (`runs-for-at-most:`), not the call, and a per-call ceiling written
      as a run ceiling would stop the wrong thing
    left: "how long one tool call may take — a Pydantic AI ceiling, not a PACT one"
  spec.metadata:
    outcome: loss
    rows: [A17]
    why: &metadata >-
      whatever the caller tags each run with, for their traces. A fact about one
      deployment's observability, not about the agent
    left: "whatever the deployment tags its runs with"
  spec.instrument:
    outcome: loss
    rows: [A23]
    why: &instrument "whether Logfire is on. A deployment choice, like `metadata`"
    left: "whether Logfire is on, which is the deployment's choice"
  spec.json_schema_path:
    outcome: loss
    rows: [A23]
    why: >-
      `$schema` — which JSON Schema file an editor should autocomplete this spec
      against. A fact about the file, not about the agent
  agent.model:
    outcome: carried
    rows: [M1, M3]
    pact: "agent `model:`"
  agent.name:
    outcome: carried
    rows: [A2]
    pact: "agent `name:`"
  agent.description:
    outcome: carried
    rows: [A2]
    pact: "agent `description:`"
  agent.instructions:
    outcome: mapped
    rows: [A3, A4]
    pact: "agent `instructions:`"
  agent.system_prompts:
    outcome: mapped
    rows: [A3]
    pact: "agent `instructions:`, appended"
  agent.model_settings:
    outcome: carried
    rows: [A8]
    pact: "`settings:`"
  agent.output_type:
    outcome: carried
    rows: [O2]
    pact: "`answers-with:`"
  agent.toolsets:
    outcome: mapped
    rows: [T1, T11]
    pact: "`uses:`, and one `tools/<name>.yaml` per tool"
  agent.end_strategy:
    outcome: loss
    rows: [A16]
    why: *end_strategy
  agent.retries:
    outcome: loss
    rows: [A14]
    why: *retries
  agent.tool_timeout:
    outcome: loss
    rows: [A15]
    why: *tool_timeout
  agent.metadata:
    outcome: loss
    rows: [A17]
    why: *metadata
  agent.instrument:
    outcome: loss
    rows: [A23]
    why: *instrument
  agent.deps_type:
    outcome: loss
    rows: [A6]
    why: >-
      the Python type dependencies are injected as. PACT's `run-inputs:` names what the
      surrounding system supplies and the shape of each; it does not name a class,
      because a class is not portable to another language
  agent.output_validators:
    outcome: loss
    rows: [O7]
    why: >-
      `@agent.output_validator` functions — Python that inspects an output and may raise
      `ModelRetry`. PACT's equivalent is an eval or a judged rule, which is an authored
      sentence rather than a callable
  agent.capabilities:
    outcome: loss
    rows: [A11, N1]
    why: >-
      Pydantic AI middleware around `_agent_graph`. See `interceptors:` — the shapes do
      not correspond, so nothing is claimed
  settings.timeout:
    outcome: loss
    rows: [A10]
    why: >-
      the HTTP timeout for one request. A transport-level knob the surrounding system
      owns; PACT's `finishes-within:` is a promise about the RUN
  settings.logit_bias:
    outcome: loss
    rows: [A10]
    why: >-
      per-token probability nudges, keyed by the tokeniser's own token ids. Those ids
      differ per model, so the setting is not portable by construction — the same block
      means something else on the next model
  settings.extra_headers:
    outcome: loss
    rows: [A10]
    why: "raw HTTP headers for one provider. Not a fact about the agent"
  settings.extra_body:
    outcome: loss
    rows: [A10]
    why: "raw request-body fields for one provider. Not a fact about the agent"

  # ── message parts (02P C1): what crosses into a PACT history and what does not.
  # The crossing is `pact_agent.to_pact_history` / `from_history`, whose own report
  # names each field it leaves behind.
  part.SystemPromptPart:
    outcome: loss
    rows: [C1]
    why: >-
      a system prompt that arrived inside a conversation. PACT builds the system text
      for each stage from the author's `instructions:`, skills and `answers-with:`, so
      one handed in from elsewhere does not cross
  part.UserPromptPart:
    outcome: mapped
    rows: [C1, F1]
    pact: "a `user` turn of the history (`content:`); a part that is not text is named in the crossing's report"
  part.ToolReturnPart:
    outcome: mapped
    rows: [C1, T3]
    pact: "a `tool` turn of the history (`name:` and `content:`)"
  part.RetryPromptPart:
    outcome: loss
    rows: [C1]
    why: >-
      another framework's loop correcting the model. PACT owns the loop, and reading a
      retry as a turn would make the agent answer the correction instead of the question
  part.SpeechPart:
    outcome: loss
    rows: [M11]
    why: &speech >-
      speech to speech in one realtime session. Each voice turn is a message in PACT;
      a realtime session does not cross
  part.ToolSearchCallPart:
    outcome: loss
    rows: [T9]
    why: &tool-search >-
      Pydantic AI's own tool search, which the runtime turns on by itself. There is
      nothing to write in PACT, so nothing records the search
  part.ToolSearchReturnPart:
    outcome: loss
    rows: [T9]
    why: *tool-search
  part.LoadCapabilityCallPart:
    outcome: loss
    rows: [X3]
    why: &load-capability >-
      a capability loaded on demand. Skills always load on demand in PACT, so a load
      is not a turn of the conversation
  part.LoadCapabilityReturnPart:
    outcome: loss
    rows: [X3]
    why: *load-capability
  part.ToolAvailabilityDeltaPart:
    outcome: loss
    rows: [T8, T9]
    why: &tools-offered >-
      a change in which tools the model is offered, made by Pydantic AI's loop. PACT
      decides what a stage may use when the tree is checked (`may-use:`,
      `available-when:`)
  part.TextPart:
    outcome: mapped
    rows: [C1]
    pact: "an `assistant` turn's `content:`"
  part.ToolCallPart:
    outcome: mapped
    rows: [C1]
    pact: "an `assistant` turn's `tool_calls:` (the names; the crossing's report says the arguments stay behind)"
  part.ThinkingPart:
    outcome: mapped
    rows: [C1]
    pact: "an `assistant` turn's `thinking:`, which `drop-parts: the model's own thinking` matches"
  part.NativeToolCallPart:
    outcome: loss
    rows: [N7]
    why: &native >-
      a tool the provider ran on its own side. PACT reaches other systems only through
      the tools the author wrote, so a provider's own call has nowhere to go
  part.NativeToolReturnPart:
    outcome: loss
    rows: [N7]
    why: *native
  part.NativeToolSearchCallPart:
    outcome: loss
    rows: [N7, T9]
    why: *native
  part.NativeToolSearchReturnPart:
    outcome: loss
    rows: [N7, T9]
    why: *native
  part.CompactionPart:
    outcome: loss
    rows: [C4]
    why: >-
      a provider's own summary of the earlier conversation. PACT shortens a
      conversation with `context-policy:` (`summarise-older`), which any model can do
  part.FilePart:
    outcome: loss
    rows: [F4]
    why: >-
      a file the model made inside a reply. A PACT history holds words; an answer that
      is a file is written `answers-with:` with `file` or `images`

  # ── stream events (02P S2): PACT's facade does not stream a run part by part
  # (`PactAgent.run_stream_events` yields the finished run once), so no event
  # crosses. Each names the `watch:` address that sees the same moment.
  event.PartStartEvent:
    outcome: loss
    rows: [S2]
    why: &part-events >-
      a part of a reply as it streams. PACT does not stream parts; a `watch:` on
      `step.message.completed` sees each finished reply
  event.PartDeltaEvent:
    outcome: loss
    rows: [S2]
    why: *part-events
  event.PartEndEvent:
    outcome: loss
    rows: [S2]
    why: *part-events
  event.FinalResultEvent:
    outcome: loss
    rows: [S2]
    why: "the moment the final answer begins. A `watch:` on `turn.message.completed` sees the answer"
  event.EnqueuedMessagesEvent:
    outcome: loss
    rows: [A21]
    why: "messages queued into a running run. PACT has no steering yet; a run takes its input when it starts"
  event.FunctionToolCallEvent:
    outcome: loss
    rows: [S2]
    why: "a tool call starting. A `watch:` on `step.tool.started` sees it"
  event.FunctionToolResultEvent:
    outcome: loss
    rows: [S2]
    why: "a tool call's result. A `watch:` on `step.tool.completed` sees it"
  event.ToolAvailabilityDeltaEvent:
    outcome: loss
    rows: [T8, T9]
    why: *tools-offered
  event.OutputToolCallEvent:
    outcome: loss
    rows: [S2, O4]
    why: &output-tool >-
      Pydantic AI's output tool, its way of taking a typed answer. PACT takes the
      answer in `answers-with:`; a `watch:` on `turn.message.completed` sees it
  event.OutputToolResultEvent:
    outcome: loss
    rows: [S2, O4]
    why: *output-tool
  event.DeferredToolRequestsEvent:
    outcome: loss
    rows: [H1, H2]
    why: "a run ending to wait. A PACT run parks with a `Suspension`; a `watch:` on `step.approval.requested` sees it"
  event.DeferredToolResultsEvent:
    outcome: loss
    rows: [H3, H4]
    why: "the answers a waiting run resumes with. A `watch:` on `step.approval.completed` sees each"
  event.RealtimeTurnCompleteEvent:
    outcome: loss
    rows: [M11]
    why: *speech
  event.RealtimeInputSpeechStartEvent:
    outcome: loss
    rows: [M11]
    why: *speech
  event.RealtimeInputSpeechEndEvent:
    outcome: loss
    rows: [M11]
    why: *speech
  event.RealtimeOutputSpeechStartEvent:
    outcome: loss
    rows: [M11]
    why: *speech
  event.RealtimeOutputSpeechEndEvent:
    outcome: loss
    rows: [M11]
    why: *speech
  event.RealtimeResponseInterruptedEvent:
    outcome: loss
    rows: [M11]
    why: *speech
  event.RealtimeInputTranscriptionErrorEvent:
    outcome: loss
    rows: [M11]
    why: *speech
  event.RealtimeSessionReconnectEvent:
    outcome: loss
    rows: [M11]
    why: *speech
  event.RealtimeSessionErrorEvent:
    outcome: loss
    rows: [M11]
    why: *speech
  event.CustomEvent:
    outcome: loss
    rows: [S3]
    why: &own-events >-
      an event a capability or a tool's own code emits. Code does not cross (02P §1
      rule 3); a `watch:` sees the moments PACT's own run passes
  event.CapabilityEvent:
    outcome: loss
    rows: [S3, X1]
    why: *own-events

  # ── `ToolDefinition` fields (02P T1, T2, T7): what PACT's tool files say of each.
  tool-definition.name:
    outcome: carried
    rows: [T1]
    pact: "the tool's file name, `tools/<name>.yaml`"
  tool-definition.description:
    outcome: carried
    rows: [T1]
    pact: "`description:` of the tool and of each action"
  tool-definition.parameters_json_schema:
    outcome: carried
    rows: [T1]
    pact: "`actions.<a>.takes:`"
  tool-definition.return_schema:
    outcome: carried
    rows: [T2]
    pact: "`actions.<a>.answers-with:`"
  tool-definition.include_return_schema:
    outcome: mapped
    rows: [T2]
    pact: "`actions.<a>.answers-with:`, shown to the model from the schema `return_schema_for` builds"
  tool-definition.kind:
    outcome: mapped
    rows: [T7, T11, H1]
    pact: "a tool with a host executor is `function`; with none, `external` (the run ends with `DeferredToolRequests`); a call `policy:` gates is held for a person"
  tool-definition.sequential:
    outcome: mapped
    rows: [A13, T7]
    pact: "`reads-only:` — a read may run beside others; a write runs alone"
  tool-definition.strict:
    outcome: loss
    rows: [T7]
    why: >-
      whether the provider must keep to the argument schema exactly. PACT reads every
      argument against `takes:` itself, so the host's model decides and nothing is
      written
  tool-definition.timeout:
    outcome: loss
    rows: [A15]
    why: *tool_timeout
  tool-definition.metadata:
    outcome: loss
    rows: [T7]
    why: "what a toolset tags a tool with for its own code. Not a fact about what the tool does"
  tool-definition.outer_typed_dict_key:
    outcome: loss
    rows: [T7]
    why: "how Pydantic AI unwraps arguments for one Python function. A PACT action's arguments are `takes:` as written"
  tool-definition.defer_loading:
    outcome: loss
    rows: [T9]
    why: *tool-search
  tool-definition.unless_native:
    outcome: loss
    rows: [N1]
    why: &native-pair >-
      how Pydantic AI pairs a local tool with a provider's own one. PACT reaches other
      systems only through the tools the author wrote
  tool-definition.with_native:
    outcome: loss
    rows: [N1]
    why: *native-pair
  tool-definition.tool_kind:
    outcome: loss
    rows: [T7]
    why: "which runtime executes the tool. PACT's tools are the author's files, and who runs one is the host's choice"
  tool-definition.toolset_id:
    outcome: loss
    rows: [T12]
    why: &whose-tool >-
      which toolset or capability a tool came from, Pydantic AI's own bookkeeping.
      PACT flattens every tool into `uses:`
  tool-definition.capability_id:
    outcome: loss
    rows: [T12, X1]
    why: *whose-tool

  # ── pydantic-graph `GraphBuilder` (02P G1-G9). PACT has no workflow document yet
