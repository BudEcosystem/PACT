# Pydantic AI's own names that are not capabilities, and what PACT says of
# each, read by the two importers and the exporter. `spec.<key>` is a key of an
# `AgentSpec` file, `agent.<attr>` the attribute of a live `Agent` a report names,
# `settings.<key>` a `ModelSettings` key outside the twelve
# `pydantic_ai_transport._SETTINGS` maps (that table is the authority on those).
# Five more doors are named so the completeness test (02P §6 S4) can hold every
# name the installed Pydantic AI has: `part.<Class>` a message part (what a
# conversation is made of), `event.<Class>` a member of `AgentStreamEvent`,
# `tool-definition.<field>` a field of `ToolDefinition`, `graph.<method>` a
# public member of pydantic-graph's `GraphBuilder`, and `evaluator.<Class>` an
# evaluator pydantic-evals ships, as a dataset file names it.
# `pact:` is PACT's spelling of one that crosses; `why:` the named loss; `left:`
# what an export leaves to Pydantic AI's own default, and why.
names:
  spec.model:
    outcome: carried
    rows: [M1, M3]
    pact: "agent `model:`"
  spec.name:
    outcome: carried
    rows: [A2]
    pact: "agent `name:`"
  spec.description:
    outcome: carried
    rows: [A2]
    pact: "agent `description:`"
  spec.instructions:
    outcome: mapped
    rows: [A3, A4]
    pact: "agent `instructions:`"
  spec.model_settings:
    outcome: carried
    rows: [A8]
    pact: "`settings:`"
  spec.output_schema:
    outcome: carried
    rows: [O2]
    pact: "`answers-with:`"
  spec.deps_schema:
    outcome: mapped
    rows: [A6]
    pact: "`run-inputs:`"
  spec.capabilities:
    outcome: mapped
    rows: [A11, N1]
    pact: "`settings.thinking:` and `uses:`, per capability"
  spec.end_strategy:
    outcome: loss
    rows: [A16]
    why: &end_strategy >-
      `early`/`graceful`/`exhaustive` — what Pydantic AI does with tool calls the model
      requested alongside a final result. That is a property of `_agent_graph`'s loop,
      and PACT owns loop semantics itself (`loop:`), so copying the word across would
      claim a stage vocabulary PACT never ran
    left: >-
      what to do with tool calls the model requested alongside a final result. PACT owns
      loop semantics and has no word for this, so Pydantic AI's own default (`graceful`)
      stands
  spec.retries:
    outcome: loss
    rows: [A14]
    why: &retries >-
      how many times Pydantic AI re-asks the model after a tool or output validation
      failure. PACT has no retry budget: a failure is a `limits:` question
      (`when-it-runs-out:`), decided per ceiling and not per category
    left: "how often to re-ask after a tool or output failure — a Pydantic AI budget"
  spec.tool_timeout:
    outcome: loss
    rows: [A15]
    why: &tool_timeout >-
      how long one tool call may take before Pydantic AI returns a retry prompt. PACT
      bounds the RUN (`runs-for-at-most:`), not the call, and a per-call ceiling written
      as a run ceiling would stop the wrong thing
    left: "how long one tool call may take — a Pydantic AI ceiling, not a PACT one"
  spec.metadata:
    outcome: loss
    rows: [A17]
    why: &metadata >-
      whatever the caller tags each run with, for their traces. A fact about one
      deployment's observability, not about the agent
    left: "whatever the deployment tags its runs with"
  spec.instrument:
    outcome: loss
    rows: [A23]
    why: &instrument "whether Logfire is on. A deployment choice, like `metadata`"
    left: "whether Logfire is on, which is the deployment's choice"
  spec.json_schema_path:
    outcome: loss
    rows: [A23]
    why: >-
      `$schema` — which JSON Schema file an editor should autocomplete this spec
      against. A fact about the file, not about the agent
  agent.model:
    outcome: carried
    rows: [M1, M3]
    pact: "agent `model:`"
  agent.name:
    outcome: carried
    rows: [A2]
    pact: "agent `name:`"
  agent.description:
    outcome: carried
    rows: [A2]
    pact: "agent `description:`"
  agent.instructions:
    outcome: mapped
    rows: [A3, A4]
    pact: "agent `instructions:`"
  agent.system_prompts:
    outcome: mapped
    rows: [A3]
    pact: "agent `instructions:`, appended"
  agent.model_settings:
    outcome: carried
    rows: [A8]
    pact: "`settings:`"
  agent.output_type:
    outcome: carried
    rows: [O2]
    pact: "`answers-with:`"
  agent.toolsets:
    outcome: mapped
    rows: [T1, T11, T12]
    pact: >-
      `uses:`, and a `tools/<name>.yaml` per tool (an MCP server's tools as the actions of
      one file named for its prefix), each offered under the name Pydantic AI offered it
  agent.end_strategy:
    outcome: loss
    rows: [A16]
    why: *end_strategy
  agent.retries:
    outcome: loss
    rows: [A14]
    why: *retries
  agent.tool_timeout:
    outcome: loss
    rows: [A15]
    why: *tool_timeout
  agent.metadata:
    outcome: loss
    rows: [A17]
    why: *metadata
  agent.instrument:
    outcome: loss
    rows: [A23]
    why: *instrument
  agent.deps_type:
    outcome: loss
    rows: [A6]
    why: >-
      the Python type dependencies are injected as. PACT's `run-inputs:` names what the
      surrounding system supplies and the shape of each; it does not name a class,
      because a class is not portable to another language
  agent.output_validators:
    outcome: loss
    rows: [O7]
    why: >-
      `@agent.output_validator` functions — Python that inspects an output and may raise
      `ModelRetry`. PACT's equivalent is an eval or a judged rule, which is an authored
      sentence rather than a callable
  agent.not_shown:
    outcome: loss
    rows: [A14, A17, A18, M4, O7]
    why: >-
      Pydantic AI does not show this through its public API: an agent's output
      validators, its retry budgets for tools and for answers, its metadata, how many of
      its runs may go at once (`max_concurrency`), a fallback model's own test for when
      to fall back (`fallback_on`), and any instruction function that writes nothing for
      the deps the importer built. So this import cannot tell whether the agent has any.
      If it does, write `checked-by:` with `checks-at-most:` for a validator,
      `if-it-fails:` with `at-most:` for a retry budget, a Rule for how many at once, and
      the instruction as text with a `{{run-inputs.<name>}}` blank
  agent.event_stream_handler:
    outcome: loss
    rows: [S3]
    why: >-
      a function that reads every event of a run as it happens. Code does not cross;
      write a `watch:` for what it observes
  agent.validation_context:
    outcome: loss
    rows: [A7]
    why: >-
      a value handed to the Pydantic validators of tool arguments and answers. PACT
      checks arguments against `takes:` and answers against `answers-with:` itself, with
      no context of the host's
  agent.prepare:
    outcome: loss
    rows: [T8]
    why: >-
      a `prepare=` function that rewrites a tool's definition for each step. Code does
      not cross: the definition it made with the deps the importer built is carried.
      Narrow a stage with `may-use:`, or offer a tool only sometimes with
      `available-when:`
  agent.capabilities:
    outcome: loss
    rows: [A11, N1]
    why: >-
      Pydantic AI middleware around `_agent_graph`. See `interceptors:` — the shapes do
      not correspond, so nothing is claimed
  settings.timeout:
    outcome: loss
    rows: [A10]
    why: >-
      the HTTP timeout for one request. A transport-level knob the surrounding system
      owns; PACT's `finishes-within:` is a promise about the RUN
  settings.logit_bias:
    outcome: loss
    rows: [A10]
    why: >-
      per-token probability nudges, keyed by the tokeniser's own token ids. Those ids
      differ per model, so the setting is not portable by construction — the same block
      means something else on the next model
  # Pydantic AI 2.59: two more of one request's transport, the host's as `timeout` is.
  settings.request_timeout:
    outcome: loss
    rows: [A10]
    why: >-
      a deadline for one request to one model, every attempt and a stream's last chunk
      included. The host's model binding owns it (budflow's `--model-timeout`); PACT's
      `finishes-within:` is a promise about the RUN
  settings.max_retries:
    outcome: loss
    rows: [A10]
    why: >-
      how often the provider's client asks again for one request. The host's model binding
      owns it (budflow's `--model-retries`); PACT's `if-it-fails:` says what the agent does
      when a call fails
  settings.extra_headers:
    outcome: loss
    rows: [A10]
    why: "raw HTTP headers for one provider. Not a fact about the agent"
  settings.extra_body:
    outcome: loss
    rows: [A10]
    why: "raw request-body fields for one provider. Not a fact about the agent"
  settings.cache:
    outcome: loss
    rows: [C7]
    why: *prompt-caching

  # ── message parts (02P C1): what crosses into a PACT history and what does not.
  # The crossing is `pact_agent.to_pact_history` / `from_history`, whose own report
  # names each field it leaves behind.
  part.SystemPromptPart:
    outcome: loss
    rows: [C1]
    why: >-
      a system prompt that arrived inside a conversation. PACT builds the system text
      for each stage from the author's `instructions:`, skills and `answers-with:`, so
      one handed in from elsewhere does not cross
  # Pydantic AI 2.59: a run's instructions kept in its history, as changes from a baseline.
  part.InstructionDeltaPart:
    outcome: loss
    rows: [C1]
    why: &instructions-in-history >-
      operator instructions changed or withdrawn inside a conversation. PACT builds the
      system text for each stage from the author's `instructions:`, skills and
      `answers-with:`, so instructions kept in another framework's history do not cross
  part.InstructionBaselinePart:
    outcome: loss
    rows: [C1]
    why: *instructions-in-history
  part.UserPromptPart:
    outcome: mapped
    rows: [C1, F1]
    pact: "a `user` turn of the history (`content:`); a part that is not text is named in the crossing's report"
  part.ToolReturnPart:
    outcome: mapped
    rows: [C1, T3]
    pact: "a `tool` turn of the history (`name:` and `content:`)"
  part.RetryPromptPart:
    outcome: loss
    rows: [C1]
    why: >-
      another framework's loop correcting the model. PACT owns the loop, and reading a
      retry as a turn would make the agent answer the correction instead of the question
  part.SpeechPart:
    outcome: loss
    rows: [M11]
    why: &speech >-
      speech to speech in one realtime session. Each voice turn is a message in PACT;
      a realtime session does not cross
  part.ToolSearchCallPart:
    outcome: loss
    rows: [T9]
    why: &tool-search >-
      Pydantic AI's own tool search, which the runtime turns on by itself. There is
      nothing to write in PACT, so nothing records the search
  part.ToolSearchReturnPart:
    outcome: loss
    rows: [T9]
    why: *tool-search
  part.LoadCapabilityCallPart:
    outcome: loss
    rows: [X3]
    why: &load-capability >-
      a capability loaded on demand. Skills always load on demand in PACT, so a load
      is not a turn of the conversation
  part.LoadCapabilityReturnPart:
    outcome: loss
    rows: [X3]
    why: *load-capability
  part.ToolAvailabilityDeltaPart:
    outcome: loss
    rows: [T8, T9]
    why: &tools-offered >-
      a change in which tools the model is offered, made by Pydantic AI's loop. PACT
      decides what a stage may use when the tree is checked (`may-use:`,
      `available-when:`)
  part.TextPart:
    outcome: mapped
    rows: [C1]
    pact: "an `assistant` turn's `content:`"
  part.ToolCallPart:
    outcome: mapped
    rows: [C1]
    pact: "an `assistant` turn's `tool_calls:` (the names; the crossing's report says the arguments stay behind)"
  part.ThinkingPart:
    outcome: mapped
    rows: [C1]
    pact: "an `assistant` turn's `thinking:`, which `drop-parts: the model's own thinking` matches"
  part.NativeToolCallPart:
    outcome: loss
    rows: [N7]
    why: &native >-
      a tool the provider ran on its own side. PACT reaches other systems only through
      the tools the author wrote, so a provider's own call has nowhere to go
  part.NativeToolReturnPart:
    outcome: loss
    rows: [N7]
    why: *native
  part.NativeToolSearchCallPart:
    outcome: loss
    rows: [N7, T9]
    why: *native
  part.NativeToolSearchReturnPart:
    outcome: loss
    rows: [N7, T9]
    why: *native
  part.CompactionPart:
    outcome: loss
    rows: [C4]
    why: >-
      a provider's own summary of the earlier conversation. PACT shortens a
      conversation with `context-policy:` (`summarise-older`), which any model can do
  part.FilePart:
    outcome: loss
    rows: [F4]
    why: >-
      a file the model made inside a reply. A PACT history holds words; an answer that
      is a file is written `answers-with:` with `file` or `images`

