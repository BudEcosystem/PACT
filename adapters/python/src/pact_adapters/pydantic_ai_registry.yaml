    rows: [N1]
    why: &native-pair >-
      how Pydantic AI pairs a local tool with a provider's own one. PACT reaches other
      systems only through the tools the author wrote
  tool-definition.with_native:
    outcome: loss
    rows: [N1]
    why: *native-pair
  tool-definition.tool_kind:
    outcome: loss
    rows: [T7]
    why: "which runtime executes the tool. PACT's tools are the author's files, and who runs one is the host's choice"
  tool-definition.toolset_id:
    outcome: loss
    rows: [T12]
    why: &whose-tool >-
      which toolset or capability a tool came from, Pydantic AI's own bookkeeping.
      PACT flattens every tool into `uses:`
  tool-definition.capability_id:
    outcome: loss
    rows: [T12, X1]
    why: *whose-tool

  # ── pydantic-graph `GraphBuilder` (02P G1-G9). A built graph is read as a workflow
  # (`pydantic_graph_reading.workflow_of`, WP-39) through its public attributes, without
  # running any step, and a workflow lowers to one (`pydantic_graph_lowering.graph_of`).
  graph.Source:
    outcome: mapped
    rows: [G1]
    pact: "the stage a route leaves from"
  graph.Destination:
    outcome: mapped
    rows: [G1]
    pact: "the stage a route reaches, or `done`"
  graph.add:
    outcome: mapped
    rows: [G1]
    pact: "each stage's `then:`, one route per edge"
  graph.add_edge:
    outcome: mapped
    rows: [G1]
    pact: "a stage's `then: {answered: <stage>}`"
  graph.add_mapping_edge:
    outcome: mapped
    rows: [G5]
    pact: "`does: each` over the list, its own stages inside"
  graph.build:
    outcome: mapped
    rows: [G1]
    pact: "`workflows/<name>.yaml`, read from the built graph without running any step; each step's body is a host action to write"
  graph.decision:
    outcome: mapped
    rows: [G3]
    pact: "`does: decide` on the rules rung, one label per branch"
  graph.edge_from:
    outcome: mapped
    rows: [G1, G4]
    pact: "a stage's `then:`; a broadcast to fixed branches is `does: together`"
  graph.end_node:
    outcome: mapped
    rows: [G7]
    pact: "`done`; a path's label to the end is `stop-and-say-so` on an `ask-someone`'s `nobody-answered:`, the one outcome that names a route word, and any other label is named"
  graph.join:
    outcome: mapped
    rows: [G6]
    pact: "the end of an `each` or a `together`: `ReduceFirstValue` is `waits-for: anyone`, the list reducers keep all, `reduce_sum` and `reduce_dict_update` are `combines-by:` lines (`add-up`, `merge`); an author's own reducer is a loss"
  graph.match:
    outcome: mapped
    rows: [G3]
    pact: "one label of a `decide` (a `Literal`'s value, a class's name); a `matches=` function is a loss"
  graph.match_node:
    outcome: loss
    rows: [G3, G8]
    why: >-
      a branch to a v1 `BaseNode`, whose `run` is code that also picks what comes next (02P G8);
      write the node as stages
  graph.node:
    outcome: loss
    rows: [G8]
    why: >-
      a v1 `BaseNode` step: its `run` is code that also picks what comes next (02P G8). It is read
      as a `call` stage and named
  graph.start_node:
    outcome: mapped
    rows: [G7]
    pact: "`starts-at:`"
  graph.step:
    outcome: mapped
    rows: [G2]
    pact: "`does: call`, named for the step; its body is a host action to write in `tools/<graph>.yaml`"
  graph.stream:
    outcome: loss
    rows: [G8]
    why: >-
      a step that streams. Streams are out of scope for PACT workflows (02P G8): it is read as a
      `call` stage and named

  # ── pydantic-evals evaluators (02P E1-E10), read from a dataset file by
  # `pydantic_evals_datasets.from_pydantic_evals` (WP-39); the package itself is never imported.
  evaluator.EqualsExpected:
    outcome: mapped
    rows: [E2]
    pact: "the case's `expect:`, which every case is held to"
  evaluator.Equals:
    outcome: mapped
    rows: [E2]
    pact: "`must-say-one-of: [<value>]`"
  evaluator.Contains:
    outcome: mapped
    rows: [E2]
    pact: "`must-contain: [<value>]`"
  evaluator.IsInstance:
    outcome: mapped
    rows: [E3]
    pact: "always on: `answers-with:` is validated on every run"
  evaluator.MaxDuration:
    outcome: mapped
    rows: [E4]
    pact: "`limits: {finishes-within: <n> seconds}` on the agent or workflow under test"
  evaluator.LLMJudge:
    outcome: carried
    rows: [E6]
    pact: "`judged: <rubric>`, graded by `graded-by:` (the catalogue row of its `model`)"
  evaluator.HasMatchingSpan:
    outcome: loss
    rows: [E5]
    why: >-
      a span query states that a span was recorded, never in what order, and PACT's one rule about
      calls (`must-call-before:`) states an order, never that a call happened: neither says the
      other. A span of a tool call names the `must-call-before:` line to write; any other span is a
      trace's, which a PACT case does not read
  evaluator.GEval:
    outcome: loss
    rows: [E6, E7]
    why: >-
      a scored rubric graded in steps; PACT's judged rule is one sentence a grader passes or fails.
      Write its criteria as `judged:`
  evaluator.ToolCorrectness:
    outcome: loss
    rows: [E5]
    why: >-
      which tools were called, counted. PACT checks the order of calls (`must-call-before:`), not
      their count
  evaluator.TrajectoryMatch:
    outcome: loss
    rows: [E5]
    why: >-
      a score for how close the calls came to a sequence. Write each pair that must come in order as
      `must-call-before: {call: <later>, first: <earlier>}`
  evaluator.ArgumentCorrectness:
    outcome: loss
    rows: [E5]
    why: >-
      the arguments one call was given. A PACT case reads the answer and the order of calls, not the
      arguments
  evaluator.MaxToolCalls:
    outcome: loss
    rows: [E5]
    why: >-
      a ceiling checked after the run; PACT holds it during the run: `limits: {tool-calls-at-most:
      <n>}` on the agent under test
  evaluator.MaxModelRequests:
    outcome: loss
    rows: [E5]
    why: >-
      a ceiling checked after the run; PACT holds it during the run: `limits: {steps-at-most: <n>}`
      on the agent under test
  evaluator.ConfusionMatrixEvaluator:
    outcome: loss
    rows: [E7]
    why: &report-evaluator >-
      a report evaluator, which scores the whole run of a dataset in code. Write the measure as a
      `metrics:` line (`program:` names a carried program of the tree's own)
  evaluator.PrecisionRecallEvaluator:
    outcome: loss
    rows: [E7]
    why: *report-evaluator
  evaluator.ROCAUCEvaluator:
    outcome: loss
    rows: [E7]
    why: *report-evaluator
  evaluator.KolmogorovSmirnovEvaluator:
    outcome: loss
    rows: [E7]
    why: *report-evaluator
