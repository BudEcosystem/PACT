  Capability:
    outcome: loss
    rows: [X1]
  CombinedCapability:
    outcome: loss
    rows: [X1]
  WrapperCapability:
    outcome: loss
    rows: [X1]
  DynamicCapability:
    outcome: loss
    rows: [X1]
  TemporalDurability:
    outcome: loss
    rows: [D1]
    why: &the-engine-is-the-hosts >-
      which durable engine runs the agent is the host's choice; PACT's
      `workspace.durability:` says whether a run must survive a restart, and
      the host picks the engine that keeps that promise
  DBOSDurability:
    outcome: loss
    rows: [D1]
    why: *the-engine-is-the-hosts
  PrefectDurability:
    outcome: loss
    rows: [D1]
    why: *the-engine-is-the-hosts
  BaseDurabilityCapability:
    outcome: loss
    rows: [D1]
    why: *the-engine-is-the-hosts
  OpenAICompaction:
    outcome: loss
    rows: [C4]
    why: &provider-compaction >-
      a provider shortening the conversation on its own servers (hosted only, so
      unusable air-gapped). PACT shortens a conversation with `context-policy:`
      (`summarise-older` with `summarised-by:`), which any model can do
  AnthropicCompaction:
    outcome: loss
    rows: [C4]
    why: *provider-compaction
  # Pydantic AI 2.57 (the latest 2.x when WP-38 ran the suite on it): one capability and
  # its `ModelSettings` key, below under `settings.cache`. Named so the suite holds on both.
  Caching:
    outcome: loss
    rows: [C7]
    why: &prompt-caching >-
      the provider keeping the stable start of a prompt to read again more cheaply (a
      fact about one provider's pricing and the request, not about the agent). PACT
      writes no cache points; the host's model binding decides whether a provider caches

  # ── pydantic-ai-harness 0.54 (02P §4.1): read only to recognise a live agent's
  # capabilities. None is translated yet; each is a named loss naming the PACT
  # construct to write instead.
  CodeMode:
    outcome: loss
    rows: [X4]
    why: >-
      the harness's `CodeMode`: model-written code run in a sandbox. Write a `run-code` stage (`does: run-code`, with `fuel:` and `may-use:`)
  DynamicWorkflow:
    outcome: loss
    rows: [K4]
    why: >-
      the harness's `DynamicWorkflow`: helpers the model brings in while it runs. Write `teamwork.may-start:` with `limits.starts-at-most:`
  Skills:
    outcome: loss
    rows: [X5]
    why: >-
      the harness's `Skills`: Agent Skills folders. Write each as `skills/<name>/SKILL.md` and name it on `skills:`
  SubAgents:
    outcome: loss
    rows: [K3]
    why: >-
      the harness's `SubAgents`: subagents it hands tasks to. Write each as an agent and name them on `team:`
  DelegationReports:
