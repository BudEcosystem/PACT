# `pact:loop/plan-then-do` — think first, act second.
#
# The planning stage is given NO tools. That is the whole mechanism: a model
# that cannot reach a tool has to say what it intends to do, and saying it out
# loud is most of what makes a smaller model choose the right one. The measured
# difference from `standard` on the same model and the same question is a real
# difference in behaviour, not a different label on the same run.
#
# Copy this file into your own `loops/` folder and change it. Nothing in here
# is privileged — it is read by the same code that reads a shape you write.

description: >
  Think first, then act. The first stage has no tools at all, so the agent has
  to say what it plans to do before it can do anything.

starts-at: plan

steps:
  plan:
    does: think
    says: >
      Say what you plan to do, in order, and why. Do not do any of it yet.
    then:
      # A model handed no tools can still ask for one. If it does, the ask is
      # refused and reported back — and the honest response is to move on to
      # the stage where tools exist, not to stop.
      used-a-tool: do
      answered: do

  do:
    does: use-tools
    then:
      used-a-tool: do
      answered: done
