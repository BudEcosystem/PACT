# What a value's text and fingerprints are, in every port.
#
# Four things PACT computes from a value have to come out the same in every
# runtime, or two runtimes disagree about the same run:
#
#   the text a condition reads   `contains-any-of:` and `in-share:` read a
#                                value as text. A word, a number or a yes is
#                                `str(value)` with the spaces at either end
#                                taken off and lower-cased; a record or a
#                                list is `json.dumps(value, sort_keys=True,
#                                default=str)`: keys in order, `", "` and
#                                `": "` between items, anything past ASCII
#                                written `\uXXXX`, and nothing lower-cased
#                                (`conditions._text`).
#   in-share                     the first 15 hexadecimal digits of the
#                                SHA-256 of that text, read as a fraction of
#                                16^15; the line holds when it is below the
#                                share (`conditions.holds`). A value that is
#                                absent never holds.
#   a request's digest           what a person's yes is bound to: SHA-256 of
#                                `json.dumps([[name, args], ...],
#                                sort_keys=True, default=str)` in UTF-8, as 64
#                                hexadecimal digits (`suspension.request_digest`).
#   a server's snapshot digest   what `tool-snapshot-digest:` pins: SHA-256 of
#                                `{"instructions": ..., "tools": {name:
#                                {"description": ..., "schema": ...}}}` with
#                                sorted keys, no spaces, and characters past
#                                ASCII written as themselves, prefixed
#                                `sha256:` (`mcp_bridge.digest_of`).
#
# and `looks-like:` has to recognise the same things: the five built-in
# detectors, and a declared detector's patterns as the reference's regular
# expressions read them (`$` also matches before a final newline, `\s` matches
# the control characters U+001C to U+001F).
#
# Every value below is written as JSON text, so a row means the same thing in
# every language that reads this file. `number-as-written: yes` marks the rows
# whose answer depends on how a number was written — `1.0` against `1`, `1e+20`,
# an integer past 2^53 — which the reference keeps and a port whose numbers are
# one type (JavaScript's) cannot tell apart: such a port reads `{"by": 1.0}` as
# `{"by": 1}` before it computes anything, and arrives at another digest. Those
# rows are the reference's answer; a port that cannot reproduce them says so
# rather than skipping them silently.
#
# `adapters/python/tests/test_one_fingerprint_in_every_port.py` holds the
# reference to every row. A change to any of the four is a change to every
# digest a runtime has stored, so it is a new version of the encoding, not an
# edit to this file.

text:
  - value: '"R-1001"'
    text: 'r-1001'
  - value: '"  Padded Value  "'
    text: 'padded value'
  - value: '42'
    text: '42'
  - value: '4.5'
    text: '4.5'
  - value: 'true'
    text: 'true'
  - value: '"Café Ünïcode"'
    text: 'café ünïcode'
  - value: '"İstanbul"'
    text: 'i̇stanbul'
  - value: '"ΣΑΣ"'
    text: 'σας'
  - value: '"Straße"'
    text: 'straße'
  - value: '{"b": 1, "a": "X"}'
    text: '{"a": "X", "b": 1}'
  - value: '["b", "a"]'
    text: '["b", "a"]'
  - value: '{"name": "Zoë"}'
    text: '{"name": "Zo\u00eb"}'
  - value: '{"n": 1.0}'
    text: '{"n": 1.0}'
    number-as-written: yes
  - value: '[1, [2, {"z": null, "a": true}]]'
    text: '[1, [2, {"a": true, "z": null}]]'
  - value: '1e+20'
    text: '1e+20'
    number-as-written: yes
  - value: '12345678901234567890'
    text: '12345678901234567890'
    number-as-written: yes
  - value: '0.1'
    text: '0.1'
  - value: '{"n": 1e+20}'
    text: '{"n": 1e+20}'
    number-as-written: yes

