declared:
  detectors:
    order reference: ['ORD-[0-9]{8}']
    ends with end: ['end$']
    a space: ['\s']
    upper case code: ['[A-Z]{3}-[0-9]{2}']
  rows:
    - value: '"see ORD-12345678 please"'
      looks-like: order reference
      holds: yes
    - value: '"ord-12345678"'
      looks-like: order reference
      holds: no
    - value: '"the end"'
      looks-like: ends with end
      holds: yes
    - value: '"the end\n"'
      looks-like: ends with end
      holds: yes
    - value: '"unit\u001fseparator"'
      looks-like: a space
      holds: yes
    - value: '"no-spaces"'
      looks-like: a space
      holds: no
    - value: '"ABC-12"'
      looks-like: upper case code
      holds: yes
    - value: '"abc-12"'
      looks-like: upper case code
      holds: no
    - value: '{"ref": "ORD-12345678"}'
      looks-like: order reference
      holds: yes
