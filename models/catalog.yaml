      - { runtime: vllm, endpoint: local }
    capabilities:
      tool-calling: parallel
      modality-in: [text]
      modality-out: [text]
      context-window:
        value: 32768
        provenance:
          source: >
            Qwen2.5-7B-Instruct model card, published `config.json`
            (`max_position_embeddings`). The 131072 figure quoted elsewhere is
            the YaRN-extended length and needs a serving-side override, so it is
            not what an unconfigured runtime will hold.
