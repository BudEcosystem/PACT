  # A row that says out loud what it does not know — and now says it about ONE
  # figure instead of two. The window was `unknown` because nothing in the tree
  # carried one; `genai-prices` does, so it is written down and this model's
  # context policy is measured rather than reported as unmeasurable.
  #
  # The PRICE stays `unknown`, and the reason changed rather than went away.
  # `genai-prices` publishes it as a TIERED figure — 2.50 USD per million input
  # tokens up to a 272,000-token request and 5.00 USD above it, 15.00 and 22.50
  # out — and `cost:` below holds one number per direction. Writing the base rate
  # would under-bill every long request by half, which is the undercount
  # `resolve.price_of` refuses on its own doorstep ("the input bill wearing the
  # whole bill's name"), and writing the high rate would over-bill every short
  # one and stop runs the author's cap never meant to stop. So the honest answer
  # is the one this file already has a word for. An author who needs a spend cap
  # on this family binds `gpt-5.4-mini` or `gpt-5.5` below, both of which
  # publish a single flat price, and a future `cost:` that can hold a tier is
  # what would let this row carry its own.
  gpt-5.4:
    family: gpt-5
    tier: frontier
    also-known-as:
      # The AI SDK gateway spells every model `<provider>/<model>` — its own
      # README calls `gateway('xai/grok-3-beta')` — and its vendored
      # `dist/index.d.ts` lists this one as `openai/gpt-5.4`. Written down so
      # the Vercel transport looks the row up instead of missing it, which is
      # what `also-known-as` is for.
      - "openai/gpt-5.4"
    served-by:
      - { runtime: openai-api }
    capabilities:
      tool-calling: parallel
      modality-in: [text, image]
      modality-out: [text]
      # 96 §B5, read from Pydantic AI 2.54 as pinned in `adapters/python/uv.lock`:
      # `models/openai.py` never sends `top_k`; `_drop_sampling_params_for_reasoning`
      # drops `profiles/openai.py`'s SAMPLING_PARAMS while reasoning is on.
      ignores: [top-k]
      ignores-while-thinking: [temperature, top-p, presence-penalty, frequency-penalty]
      thinks-unless-told: no    # `thinking_enabled_by_default`
      context-window:
        value: 1050000
        provenance:
          source: >
            `genai-prices` 0.0.72, the offline price and context-window data
