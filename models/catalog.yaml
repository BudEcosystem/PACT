  # The first row outside Anthropic whose price can make a spend cap fire. The
  # OpenAI Agents transport could already count the tokens a call carried — it
  # reads them off `agents.usage.Usage`, the object the SDK's own response
  # carries — and still reported `cost-per-request-under` as unenforced, because
  # the only id it could bind on its own vendor was `gpt-5.4` and that row
  # publishes no price. The OpenAI-compatible transport was one step worse off
  # in a way that looks better: it binds locally-served rows priced at a sourced
  # 0 USD, so its cap metered perfectly and read zero forever. Neither of them
  # could refuse anything. This row is the difference.
  #
  # Chosen over its siblings for one reason: its price is FLAT. `gpt-5.4` and
  # `gpt-5.4-pro` are tiered at 272,000 tokens and cannot be written here
  # truthfully; this one is 0.75 in and 4.50 out at every request size, so the
  # figure below is the figure an author is billed.
  #
  # `modality-in: [text]` is the conservative half of this row and it is a claim,
  # so it says where it stands: no image-input statement for this model could be
  # read from any source vendored in this tree. Recorded text-only rather than
  # optimistically, because the two mistakes are not symmetrical — claiming
  # vision this row may not have binds a photo-reading agent to a model that
  # cannot see, and the failure arrives mid-run in another language, while
  # claiming too little only loses the row a candidacy and prints the reason
  # ("gpt-5.4-mini cannot images") where an author can read it and override it.
  gpt-5.4-mini:
    family: gpt-5
    tier: mid
    also-known-as:
      - "openai/gpt-5.4-mini"
    served-by:
      - { runtime: openai-api }
    capabilities:
      # `parallel` because the OpenAI request type vendored in this tree carries
      # `parallel_tool_calls` — "whether to enable parallel function calling
      # during tool use" — at `openai/types/chat/completion_create_params.py` in
      # `openai` 2.48.0. A property of the API these weights are served over,
      # read from the client this distribution actually ships.
      tool-calling: parallel
      modality-in: [text]
      modality-out: [text]
      # 96 §B5, read from Pydantic AI 2.54 as pinned in `adapters/python/uv.lock`:
      # `models/openai.py` never sends `top_k`; `_drop_sampling_params_for_reasoning`
      # drops `profiles/openai.py`'s SAMPLING_PARAMS while reasoning is on.
      ignores: [top-k]
      ignores-while-thinking: [temperature, top-p, presence-penalty, frequency-penalty]
      thinks-unless-told: no    # `thinking_enabled_by_default`
      context-window:
        value: 400000
        provenance:
          source: >
            `genai-prices` 0.0.72, the offline price and context-window data
            bundled with the package at `genai_prices/data.py` and pinned by
            digest in `adapters/python/uv.lock`. Read from the `openai`
            provider's `gpt-5.4-mini` entry, field `context_window`. The model id
            is also in the AI SDK gateway model list vendored at
            `adapters/typescript/node_modules/@ai-sdk/gateway/dist/index.d.ts`,
            as `openai/gpt-5.4-mini`.
          date: 2026-07-22
          as-of: 2026-07-28
          recorded-by: jithinvg@bud.studio
    reasoning:
      value: unknown
      provenance:
        source: >
          No positioning statement for this model maps onto the four-rung
          ladder, and no benchmark figures have been imported into this
          distribution. Written `unknown` rather than guessed: Y12 makes UNKNOWN
          bind and rank last, so saying so costs the row a tie-break and never a
          candidacy.
        harness: none
        as-of: 2026-07-28
        recorded-by: jithinvg@bud.studio
    # Both halves from `genai-prices` 0.0.72, the `openai` provider's
    # `gpt-5.4-mini` entry, fields `prices.input_mtok` and `prices.output_mtok`,
    # as published on 2026-07-22 and checked on 2026-07-28 by
