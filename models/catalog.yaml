# models/catalog.yaml — DISTRIBUTION-SUPPLIED. Local-first, offline-authoritative.
#
# The author never writes this file. `20-ARCHITECTURE-DRAFT.md` §4.2 is normative
# on that point and gives the reason: the first thing a D14 system needs in order
# to run was the one file D14 had no no-code path for. A support lead cannot hand
# enter a context window for every model they might be moved onto, so the
# distribution ships it and a workspace-local `models/catalog.yaml` is an
# optional override layer, never a prerequisite.
#
# It is read from disk with no network call (D8, D17). Everything here was
# recorded by hand from a published source named per figure; nothing is fetched.
#
# WHAT IT IS FOR, today: a context policy is measured against what the model can
# hold, and until this file existed nothing could say. `harness.py` probed the
# transport, every shipped transport answered nothing, and so every run with
# `context-policy:` on it reported the policy as unenforced. The mechanism was
# honest and inert. One row per model, one window per row, one place it comes
# from.
#
# AND THE SAME FOR MONEY, from the same rows. `cost-per-request-under:` and
# `tokens-at-most:` were in exactly that state one round longer: no shipped
# transport implemented `usage()`, so `harness._meter_usage` found nothing and
# `Limits.unmeterable` put BOTH ceilings on `RunResult.unmetered` on every real
# run — an author's spend cap, honest and inert. The `cost:` block below was
# already here on every row; what was missing was a transport that read the
# token counts off the response it builds and a single place to price them.
# `resolve.price_of` is that place, `input-per-mtok` and `output-per-mtok` are
# both required to produce a figure, and the transports whose wire format
# carries the counts — the Anthropic SDK, AutoGen, the OpenAI Agents SDK and
# Ollama — now answer. One row per model, one price per row, one place it comes
# from.
#
# A PRICE ONLY ONE VENDOR CARRIES IS NOT A CEILING. Everything above was true
# and the money half still could not bite outside one family. Count the rows as
# they were: three Anthropic rows publishing both halves of a price; five
# locally-served rows priced at a SOURCED 0 USD, which meter perfectly and read
# zero for the life of the workspace (`RunResult.never_reached` says so out
# loud); and one hosted row, `gpt-5.4`, publishing no price at all. So there was
# exactly one vendor on this list whose rows could make a spend cap fire, and an
# author who pinned anything else got `cost-per-request-under` and
# `tokens-at-most` handed back on `RunResult.unmetered` — the honest-and-inert
# state this file exists to end, surviving one vendor at a time. The transports
# most likely to be pointed at somebody else's API, the OpenAI-Agents one and
# any OpenAI-compatible endpoint, had nothing priced to bind.
#
# The rows below the Anthropic ones close that: OpenAI, Google and xAI models
# the shipped transports can actually name, each with a price AND a window, so
# the ceiling an author writes is enforced against the model they chose rather
# than against whichever model this distribution happened to have priced.
#
# WHERE THOSE FIGURES WERE READ. Two dependencies already vendored in this tree,
# both pinned by digest, neither fetched at run time (D8, D17): `genai-prices`
# 0.0.72, whose bundled `genai_prices/data.py` carries a per-model
# `context_window` and a per-million input/output price and is pinned in
# `adapters/python/uv.lock`; and `@ai-sdk/gateway` 2.0.119, whose
# `dist/index.d.ts` carries the model-id list the Vercel AI transport can bind
# and is pinned in `adapters/typescript/package-lock.json`. Naming both is the
# point of the rule: a reader can open either file on a machine with no network
# and see the number this row claims.
#
# PROVENANCE IS PER FIGURE. §4.2's fifth finding is explicit — "PACT requires
# per-field `source` + `as-of` on the *resolved* entry, not on the layer" — with
# LangChain's shipped precedent named as the anti-pattern: an upstream feed that
# records source and date, a hand-written override layer that records nothing,
# and a merged result no consumer can attribute. So `context-window` is a
# `value:` with its own `provenance:`, the same shape §4.2 gives `reasoning:` and
# every `benchmarks:` entry, rather than the bare scalar its illustrative snippet
# happens to show.
#
# A FIGURE NOBODY CAN SOURCE IS WRITTEN `unknown`. §4.2: "Where a field cannot be
# discovered it is recorded as `unknown`". It is not guessed and it is not
# silently omitted — a `value: unknown` row makes the transport report no window,
# which puts `context-policy` on `RunResult.unmetered` where the author can read
# it. A `cost: unknown` row goes out the same door for the same reason (T7): a
# transport bound to it exposes no `usage()` at all, so `cost-per-request-under`
# and `tokens-at-most` are reported as unenforced rather than metered at 0.00
# USD. Pricing an unsourced row at zero would give the author a spend cap that
# can never be reached, which is strictly worse than having no cap — the same
# mistake `_cost` already records for the recommendation line, spending real
# money instead of printing a wrong figure.
#
# UNKNOWN BINDS AND RANKS LAST. Decision Y12 (`20-ARCHITECTURE-DRAFT.md` §4.2)
# is explicit: "A row with no `reasoning` block is UNKNOWN. At core tier UNKNOWN
# BINDS and ranks last." That rule is why an unsourced figure is safe to write
# down — an `unknown` never empties the candidate set, it only loses a tie. The
# same rule is applied to `context-window` here, because the two fields answer
# beginner-tier predicates (`reasoning:`, `context-at-least:`) and a beginner
# predicate that can silently match nothing is the defect Y12 was written about.
#
# `reasoning:` IS POSITIONING, NOT A BENCHMARK, AND SAYS SO. §4.2's illustrative
# row derives the rung from a `benchmarks:` block. No open benchmark figures have
# been imported into this distribution, so nothing here is derived from one. Where
# the vendor publishes a positioning statement that maps onto the ladder, the rung
# is recorded with that statement as its source and `harness: positioning` saying
# what kind of claim it is. Where no such statement exists, the rung is `unknown`.
# Nine of the thirteen rows below are `unknown`, and that is the honest number —
# it went UP with the four rows added for the other hosted vendors, because a
# price and a window were sourceable for each of them and a rung was not, and
# inventing the rung to make the row look complete is the one thing this file
# does not do.
#
# `endpoint: local` IS WHAT MAKES A ROW AIR-GAPPABLE. Decision Y16: "Egress is a
# property of the BINDING, not of one model role... the resolver refuses to bind
# any role whose catalogue row has a non-local `served-by.endpoint` unless
# listed" in `workspace.yaml`'s `allow-egress:`. So every runtime that serves the
# weights on the machine says `endpoint: local` out loud rather than leaving it
# to be inferred from the runtime's name — `ollama` looking local because of how
# it is spelled is exactly the `model.provider.includes("anthropic")` string
# match this file exists to replace.

version: 1

# Which model PACT binds when the author pins none. `spec/schema.yaml` promises
# exactly this on the agent's `model:` field — "Leave this out and PACT picks."
# A locally-servable model, because D17 puts fully air-gapped in the deployment
# set and a default that needs a hosted API is a default that cannot run there.
default: qwen2.5-7b-instruct

# The benchmarks a row may record a score for (96 §B4), named once so that
# `MMLU`, `mmlu` and `MMLU (5-shot)` are one benchmark and an agent's
# `accept-when: mmlu.score > 50` finds every row that published one. `runs:` is
# how a figure is MEASURED here: `deepeval:<name>` for the benchmarks DeepEval
# 4.1 ships (`budflow benchmark run`), `host:<name>` for one a separate harness
# runs, whose result `budflow benchmark record` writes down with its source. No
# figures are recorded below for any model — none has been measured on this
# distribution, and a figure copied from a leaderboard is recorded by whoever
# copies it, with the leaderboard as its source.
benchmarks:
  mmlu:
    description: Multiple-choice questions across 57 subjects, from school to professional level.
    also-known-as: [MMLU, "MMLU (5-shot)"]
    runs: deepeval:MMLU
    with: {n_shots: 5}
  mmlu-pro:
    description: A harder ten-option successor to MMLU, weighted towards reasoning.
    also-known-as: [MMLU-Pro]
    runs: host:mmlu-pro
  gpqa-diamond:
    description: Graduate-level science questions written to defeat search.
    also-known-as: [GPQA, GPQA Diamond]
    runs: host:gpqa
  gsm8k:
    description: Grade-school maths word problems, answered step by step.
    also-known-as: [GSM8K]
    runs: deepeval:GSM8K
  humaneval:
    description: Writing Python functions that pass hidden unit tests.
    also-known-as: [HumanEval]
    runs: deepeval:HumanEval
  hellaswag:
    description: Choosing the sensible ending of an everyday situation.
    also-known-as: [HellaSwag]
    runs: deepeval:HellaSwag
  truthfulqa:
    description: Questions people commonly answer wrongly, scored for truthfulness.
    also-known-as: [TruthfulQA]
    runs: deepeval:TruthfulQA
  big-bench-hard:
    description: The 23 hardest BIG-Bench reasoning tasks.
    also-known-as: [BBH, BIG-Bench Hard]
    runs: deepeval:BigBenchHard
  drop:
    description: Reading a passage and reasoning over the numbers in it.
    also-known-as: [DROP]
    runs: deepeval:DROP
  arc:
    description: Grade-school science questions, challenge set.
    also-known-as: [ARC, ARC-Challenge]
    runs: deepeval:ARC
  winogrande:
    description: Resolving which thing a pronoun refers to, adversarially chosen.
    also-known-as: [WinoGrande]
    runs: deepeval:Winogrande
  ifeval:
    description: Following verifiable formatting and content instructions.
    also-known-as: [IFEval]
    runs: deepeval:IFEval
  mathqa:
    description: Multiple-choice maths word problems.
    also-known-as: [MathQA]
    runs: deepeval:MathQA
  mmmu:
    description: College-level questions about images, diagrams and charts.
    also-known-as: [MMMU]
    runs: host:mmmu
  swe-bench-verified:
    description: Fixing real GitHub issues in real repositories, human-verified subset.
    also-known-as: [SWE-bench Verified, SWE-Verified]
    runs: host:swe-bench
  terminal-bench:
    description: Completing real tasks in a terminal, end to end.
    also-known-as: [Terminal-Bench, Terminal-Bench 2.0]
    runs: host:terminal-bench
  tau-bench:
    description: Customer-service conversations with tools and policies to follow.
    also-known-as: [τ-bench, tau2-bench]
    runs: host:tau-bench

